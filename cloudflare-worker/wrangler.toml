name = "gemini-proxy"
main = "src/index.js"
compatibility_date = "2024-12-01"

# Cloudflare Account ID。
# ⚠️ 这不是机密（公开标识符，相当于账号的固定地址），因此直接写在这里，
#    让本地 `wrangler deploy` 与 GitHub Actions 都能自动识别部署账号。
#    CI 里也仍会传 CLOUDFLARE_ACCOUNT_ID 环境变量，两者并存不冲突
#    （wrangler 优先读环境变量）。
account_id = "534adddcd73bc707f7ca09d7c5c08b6d"

# 环境变量（也可以在 Cloudflare Dashboard 设置）
[vars]
NODE_ENV = "production"
# 在 CF Dashboard → Workers → gemini-proxy → Settings → Variables 设置以下 Secrets：
# UPSTASH_REDIS_REST_URL = https://xxx.upstash.io
# UPSTASH_REDIS_REST_TOKEN = xxx
# API key 由客户端通过 Authorization: Bearer 传入，无需在这里配置

# Workers免费套餐限制：100,000 请求/天
